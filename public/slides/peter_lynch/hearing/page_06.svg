<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0B2545"/>

  <!-- Top Header -->
  <g id="header" transform="translate(60, 45)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#F4F6F9"/>
    <text x="70" y="18" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#C59B27" text-anchor="middle">5심 : 멘탈 심문</text>
    
    <text x="0" y="62" font-family="Pretendard, sans-serif" font-size="32" font-weight="800" fill="#0B2545">"공포와 탐욕 테스트 (-30% 폭락 시 당신의 행동)"</text>
    <text x="0" y="94" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#5A6578">투자의 성패는 두뇌가 아니라 폭락장을 견디는 배짱과 원칙에서 결정된다</text>
  </g>

  <!-- 3 Question Cards -->
  <g id="questions_layout" transform="translate(60, 160)">
    <!-- Q10 -->
    <g transform="translate(0, 0)">
      <rect width="365" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#0B2545" rx="3"/>
      
      <rect x="25" y="25" width="60" height="28" rx="6" fill="#0B2545"/>
      <text x="55" y="44" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#E5C158" text-anchor="middle">Q10</text>
      
      <text x="25" y="85" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" fill="#0B2545">-30% 폭락 감내력</text>
      <text x="25" y="110" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#C59B27">바겐세일로 보는가?</text>
      <line x1="25" y1="125" x2="340" y2="125" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="25" y="160" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#134074">■ 질문 내용:</text>
      <text x="25" y="185" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">내일 당장 시장 급락으로 이 주식이</text>
      <text x="25" y="207" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">-30% 폭락해도 패닉에 빠지지 않고</text>
      <text x="25" y="229" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">기쁜 마음으로 추가 매수할 확신이 있는가?</text>

      <rect x="20" y="260" width="325" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="35" y="285" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0B2545">💬 피터 린치의 팩폭:</text>
      <text x="35" y="308" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">"백화점에서 좋은 물건이 세일하면 사면서,</text>
      <text x="35" y="328" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">좋은 주식이 세일할 땐 왜 공포에 떨며 파는가?"</text>

      <rect x="20" y="360" width="325" height="40" rx="8" fill="#0B2545"/>
      <text x="182" y="385" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">[ ] 추가매수(10점) / [ ] 패닉(0점)</text>
    </g>

    <!-- Q11 -->
    <g transform="translate(397, 0)">
      <rect width="365" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#C59B27" rx="3"/>
      
      <rect x="25" y="25" width="60" height="28" rx="6" fill="#C59B27"/>
      <text x="55" y="44" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#0B2545" text-anchor="middle">Q11</text>
      
      <text x="25" y="85" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" fill="#0B2545">기계적 손절매 배제</text>
      <text x="25" y="110" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#C59B27">가격이 아닌 스토리를 보라</text>
      <line x1="25" y1="125" x2="340" y2="125" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="25" y="160" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#134074">■ 질문 내용:</text>
      <text x="25" y="185" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">기업의 펀더멘털 스토리가 살아있음에도</text>
      <text x="25" y="207" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">단지 -10% 하락했다는 이유로 기계적</text>
      <text x="25" y="229" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">손절매를 걸어두지 않았는가?</text>

      <rect x="20" y="260" width="325" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="35" y="285" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0B2545">💬 피터 린치의 팩폭:</text>
      <text x="35" y="308" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">"손절매 주문을 거는 것은 현재 가격보다</text>
      <text x="35" y="328" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">싸게 팔겠다고 자진 납세하는 바보짓이다."</text>

      <rect x="20" y="360" width="325" height="40" rx="8" fill="#0B2545"/>
      <text x="182" y="385" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">[ ] 스토리확인(10점) / [ ] 손절매(0점)</text>
    </g>

    <!-- Q12 -->
    <g transform="translate(795, 0)">
      <rect width="365" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#134074" rx="3"/>
      
      <rect x="25" y="25" width="60" height="28" rx="6" fill="#134074"/>
      <text x="55" y="44" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q12</text>
      
      <text x="25" y="85" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" fill="#0B2545">시간의 여유 (자금 성격)</text>
      <text x="25" y="110" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#C59B27">당장 필요한 돈이 아닌가?</text>
      <line x1="25" y1="125" x2="340" y2="125" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="25" y="160" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#134074">■ 질문 내용:</text>
      <text x="25" y="185" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">이 주식에 들어간 돈이 향후 3년 이상</text>
      <text x="25" y="207" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">전혀 쓸 일이 없는 순수한 여유 자금인가?</text>
      <text x="25" y="229" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">(학자금, 전세금, 빚투 자금 배제)</text>

      <rect x="20" y="260" width="325" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="35" y="285" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0B2545">💬 피터 린치의 팩폭:</text>
      <text x="35" y="308" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">"시간에 쫓기는 돈으로 투자하면,</text>
      <text x="35" y="328" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">가장 최악의 바닥에서 주식을 팔게 된다."</text>

      <rect x="20" y="360" width="325" height="40" rx="8" fill="#0B2545"/>
      <text x="182" y="385" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">[ ] 여유자금(10점) / [ ] 급한돈(0점)</text>
    </g>
  </g>

  <!-- Bottom Indicator -->
  <g id="bottom_indicator" transform="translate(60, 610)">
    <rect width="1160" height="50" rx="8" fill="#0B2545"/>
    <text x="40" y="31" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">5심 총점 : _____ / 30점  (급한 돈으로 투자했다면 0점 처리하십시오)</text>
  </g>
</svg>