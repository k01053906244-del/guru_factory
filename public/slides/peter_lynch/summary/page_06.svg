<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0B2545"/>

  <!-- Top Header -->
  <g id="header" transform="translate(60, 45)">
    <rect x="0" y="0" width="165" height="26" rx="13" fill="#F4F6F9"/>
    <text x="82" y="18" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#C59B27" text-anchor="middle">PART 2. 종목 발굴 기법</text>
    
    <text x="0" y="62" font-family="Pretendard, sans-serif" font-size="34" font-weight="800" fill="#0B2545">10루타(Ten-Bagger) 종목 발굴과 안전한 트렌드 투자법</text>
    <text x="0" y="94" font-family="Pretendard, sans-serif" font-size="18" font-weight="500" fill="#5A6578">검증된 소형주와 트렌드의 필수 인프라 기업에 투자할 때 가장 높은 수익률이 발생한다</text>
  </g>

  <!-- 2 Columns Layout -->
  <g id="columns" transform="translate(60, 160)">
    <!-- Left Column: 10루타 발굴 체크리스트 -->
    <g id="col1" transform="translate(0, 0)">
      <rect width="560" height="495" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="560" height="6" fill="#C59B27" rx="3"/>
      
      <text x="35" y="45" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" fill="#0B2545">1. 10루타 발굴의 4대 핵심 조건</text>
      
      <g transform="translate(35, 75)">
        <!-- Item 1 -->
        <rect x="0" y="0" width="490" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="32" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#0B2545">① 집 근처에서 발견한 소형주</text>
        <text x="20" y="58" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">대형주에서는 10배 수익이 나오기 어렵다. 가장 큰 수익은 언제나</text>
        <text x="20" y="75" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">시장의 관심 밖에 있는 작고 강한 소기업에서 나온다.</text>

        <!-- Item 2 -->
        <rect x="0" y="95" width="490" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="127" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#0B2545">② 성공 공식의 복제 능력 (전국 확장력)</text>
        <text x="20" y="153" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">단일 매장에서 입증된 비즈니스 성공 모델을 다른 지역으로</text>
        <text x="20" y="170" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">동일하게 복제하여 확장할 수 있는가? (ex: 월마트, 던킨도너츠)</text>

        <!-- Item 3 -->
        <rect x="0" y="190" width="490" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="222" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#0B2545">③ 기관투자자 및 애널리스트 미보유</text>
        <text x="20" y="248" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">월가의 분석 보고서가 없고 기관 비중이 낮을수록 좋다.</text>
        <text x="20" y="265" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">나중에 기관이 매수하기 시작할 때 주가가 폭등한다.</text>

        <!-- Item 4 -->
        <rect x="0" y="285" width="490" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="317" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#0B2545">④ 혐오스럽거나 지루한 사업 내용</text>
        <text x="20" y="343" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">이름이 따분하거나 폐기물, 장례 등 사람들이 꺼리는 업종일수록</text>
        <text x="20" y="360" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">경쟁자가 적고 주가가 저평가되어 안전마진이 높다.</text>
      </g>
    </g>

    <!-- Right Column: 곡괭이와 삽 전략 -->
    <g id="col2" transform="translate(600, 0)">
      <rect width="560" height="495" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="560" height="6" fill="#0B2545" rx="3"/>
      
      <text x="35" y="45" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" fill="#0B2545">2. 트렌드에 편승하는 '곡괭이와 삽' 전략</text>

      <!-- Illustration / Story Box -->
      <g transform="translate(35, 75)">
        <rect x="0" y="0" width="490" height="150" rx="10" fill="#0B2545"/>
        <text x="25" y="35" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#E5C158">THE GOLD RUSH LESSON</text>
        <text x="25" y="68" font-family="Pretendard, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">"골드러시 때 금을 캔 사람은 대부분 망했지만,</text>
        <text x="25" y="95" font-family="Pretendard, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">곡괭이, 삽, 청바지를 판 사람은 거부가 되었다."</text>
        <text x="25" y="130" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#8E9AA8">직접적인 트렌드 경쟁 기업보다 필수 인프라/도구 공급 기업이 안전하다</text>

        <!-- Practical Examples -->
        <rect x="0" y="165" width="490" height="220" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="25" y="200" font-family="Pretendard, sans-serif" font-size="17" font-weight="700" fill="#0B2545">실전 적용 프레임워크</text>
        
        <text x="25" y="235" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#134074">• 인터넷/이커머스 열풍 시</text>
        <text x="25" y="257" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">수많은 닷컴 기업 대신, 모든 상품을 배송해야 하는 <tspan font-weight="700" fill="#C59B27">택배/물류 기업</tspan></text>

        <text x="25" y="295" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#134074">• 신기술/하드웨어 경쟁 시</text>
        <text x="25" y="317" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">치열한 완성품 제조사 대신, 필수 부품 및 <tspan font-weight="700" fill="#C59B27">핵심 장비 공급사</tspan></text>

        <text x="25" y="355" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#10B981">✅ 트렌드의 최종 승자를 맞추기 어렵다면 인프라 독점 기업을 매수하라</text>
      </g>
    </g>
  </g>
</svg>