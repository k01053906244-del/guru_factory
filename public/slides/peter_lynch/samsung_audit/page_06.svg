<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0B2545"/>

  <g id="header" transform="translate(60, 45)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#F4F6F9"/>
    <text x="70" y="18" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#C59B27" text-anchor="middle">5심 : 멘탈 심문</text>
    <text x="0" y="62" font-family="Pretendard, sans-serif" font-size="32" font-weight="800" fill="#0B2545">5심 결과 : 20점 / 20점 만점 획득 (장기 보유 배짱)</text>
    <text x="0" y="94" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#5A6578">삼성전자는 단기 급등주가 아닌 만큼, 시간에 쫓기지 않는 여유 자금 운용이 필수</text>
  </g>

  <g id="cards" transform="translate(60, 160)">
    <g transform="translate(0, 0)">
      <rect width="565" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="565" height="6" fill="#10B981" rx="3"/>
      <rect x="30" y="30" width="90" height="30" rx="6" fill="#DCFCE7"/>
      <text x="75" y="51" font-family="Pretendard, sans-serif" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">Q10. 10점</text>
      <text x="30" y="95" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" fill="#0B2545">폭락장 감내력 : 추가 매수 확신</text>
      <line x1="30" y1="115" x2="535" y2="115" stroke="#E2E8F0" stroke-width="1"/>
      <text x="30" y="155" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#134074">■ 투자자 심리 진단:</text>
      <text x="30" y="185" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">삼성전자가 단기 실적 쇼크로 5만 원대로 밀려나더라도,</text>
      <text x="30" y="210" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">망할 회사가 아니므로 분할 매수할 배짱과 확신이 있음.</text>
      <rect x="30" y="250" width="505" height="95" rx="8" fill="#FFFFFF"/>
      <text x="45" y="280" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0B2545">💬 피터 린치의 평가:</text>
      <text x="45" y="305" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#5A6578">"주가 하락은 우량주를 싸게 살 수 있는 축복이다.</text>
      <text x="45" y="328" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#5A6578">기계적인 손절매 주문을 걸어두지 마라."</text>
      <rect x="30" y="365" width="505" height="35" rx="6" fill="#10B981"/>
      <text x="282" y="388" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">[V] 통과 (+10점)</text>
    </g>

    <g transform="translate(595, 0)">
      <rect width="565" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="565" height="6" fill="#10B981" rx="3"/>
      <rect x="30" y="30" width="90" height="30" rx="6" fill="#DCFCE7"/>
      <text x="75" y="51" font-family="Pretendard, sans-serif" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">Q11. 10점</text>
      <text x="30" y="95" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" fill="#0B2545">시간의 여유 : 순수 3년 여유자금</text>
      <line x1="30" y1="115" x2="535" y2="115" stroke="#E2E8F0" stroke-width="1"/>
      <text x="30" y="155" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#134074">■ 자금 성격 진단:</text>
      <text x="30" y="185" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">반도체 사이클 2~3년을 온전히 기다릴 수 있는</text>
      <text x="30" y="210" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#1D2430">순수 여유 자금으로 매수하여 시간에 쫓기지 않음.</text>
      <rect x="30" y="250" width="505" height="95" rx="8" fill="#FFFFFF"/>
      <text x="45" y="280" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0B2545">💬 피터 린치의 평가:</text>
      <text x="45" y="305" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#5A6578">"시간을 내 편으로 만드는 사람만이</text>
      <text x="45" y="328" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#5A6578">대형우량주의 과실을 온전히 거둘 수 있다."</text>
      <rect x="30" y="365" width="505" height="35" rx="6" fill="#10B981"/>
      <text x="282" y="388" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">[V] 통과 (+10점)</text>
    </g>
  </g>
</svg>