<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0B2545"/>

  <g id="header" transform="translate(60, 45)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#DCFCE7"/>
    <text x="70" y="18" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">4심 : 뻘짓 심문</text>
    <text x="0" y="62" font-family="Pretendard, sans-serif" font-size="32" font-weight="800" fill="#0B2545">4심 결과 : 30점 / 30점 만점 획득 (순현금 100조 원의 절대 방어력)</text>
    <text x="0" y="94" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#5A6578">무리한 사업다악화가 없고, 부채비율 25% 미만과 풍부한 순현금으로 파산 가능성 0%</text>
  </g>

  <g id="cards" transform="translate(60, 160)">
    <g transform="translate(0, 0)">
      <rect width="365" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#10B981" rx="3"/>
      <rect x="25" y="25" width="80" height="28" rx="6" fill="#DCFCE7"/>
      <text x="65" y="44" font-family="Pretendard, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">Q7. 10점</text>
      <text x="25" y="85" font-family="Pretendard, sans-serif" font-size="18" font-weight="800" fill="#0B2545">사업다악화 부재 : 만점</text>
      <line x1="25" y1="105" x2="340" y2="105" stroke="#E2E8F0" stroke-width="1"/>
      <text x="25" y="140" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#134074">■ 실제 팩트:</text>
      <text x="25" y="165" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#1D2430">엉뚱한 비관련 사업 M&amp;A를 자제하고,</text>
      <text x="25" y="187" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#1D2430">반도체/AI/파운드리 본업 R&amp;D에 집중 투자.</text>
      <text x="25" y="212" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#10B981">➔ 사업다악화 낭비 없음 (10점 만점)</text>
      <rect x="20" y="260" width="325" height="95" rx="8" fill="#FFFFFF"/>
      <text x="35" y="285" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#0B2545">💬 린치의 코멘트:</text>
      <text x="35" y="310" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">"돈을 엉뚱한 기업 인수에 날리지 않고</text>
      <text x="35" y="330" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">본업 시설투자에 쓰는 것은 정석이다."</text>
      <rect x="20" y="370" width="325" height="32" rx="6" fill="#10B981"/>
      <text x="182" y="392" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">[V] 통과 (+10점)</text>
    </g>

    <g transform="translate(397, 0)">
      <rect width="365" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#10B981" rx="3"/>
      <rect x="25" y="25" width="80" height="28" rx="6" fill="#DCFCE7"/>
      <text x="65" y="44" font-family="Pretendard, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">Q8. 10점</text>
      <text x="25" y="85" font-family="Pretendard, sans-serif" font-size="18" font-weight="800" fill="#0B2545">순현금 100조 : 만점</text>
      <line x1="25" y1="105" x2="340" y2="105" stroke="#E2E8F0" stroke-width="1"/>
      <text x="25" y="140" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#134074">■ 실제 팩트:</text>
      <text x="25" y="165" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#1D2430">현금성 자산 약 100조 원 보유, 부채비율 25%.</text>
      <text x="25" y="187" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#1D2430">자사주 매입 및 배당 여력 세계 최고 수준.</text>
      <text x="25" y="212" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#10B981">➔ 철벽의 재무 안전성 (10점 만점)</text>
      <rect x="20" y="260" width="325" height="95" rx="8" fill="#FFFFFF"/>
      <text x="35" y="285" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#0B2545">💬 린치의 코멘트:</text>
      <text x="35" y="310" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">"부채가 없고 현금이 쌓여있는 회사는</text>
      <text x="35" y="330" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">어떤 폭락장에도 주가가 바닥을 지킨다."</text>
      <rect x="20" y="370" width="325" height="32" rx="6" fill="#10B981"/>
      <text x="182" y="392" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">[V] 통과 (+10점)</text>
    </g>

    <g transform="translate(795, 0)">
      <rect width="365" height="420" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#10B981" rx="3"/>
      <rect x="25" y="25" width="80" height="28" rx="6" fill="#DCFCE7"/>
      <text x="65" y="44" font-family="Pretendard, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">Q9. 10점</text>
      <text x="25" y="85" font-family="Pretendard, sans-serif" font-size="18" font-weight="800" fill="#0B2545">과열 진정 구간 : 만점</text>
      <line x1="25" y1="105" x2="340" y2="105" stroke="#E2E8F0" stroke-width="1"/>
      <text x="25" y="140" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#134074">■ 실제 팩트:</text>
      <text x="25" y="165" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#1D2430">9만전자 시절의 광풍이 꺾이고, 현재는</text>
      <text x="25" y="187" font-family="Pretendard, sans-serif" font-size="13" font-weight="400" fill="#1D2430">비관론과 실망감이 지배하는 저평가 구간.</text>
      <text x="25" y="212" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#10B981">➔ 칵테일 파티 1~2단계 침체기 (만점)</text>
      <rect x="20" y="260" width="325" height="95" rx="8" fill="#FFFFFF"/>
      <text x="35" y="285" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#0B2545">💬 린치의 코멘트:</text>
      <text x="35" y="310" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">"모두가 실망하고 무관심할 때가 매수 시점이다.</text>
      <text x="35" y="330" font-family="Pretendard, sans-serif" font-size="12" font-weight="400" fill="#5A6578">치과의사가 추천할 때는 이미 지났다."</text>
      <rect x="20" y="370" width="325" height="32" rx="6" fill="#10B981"/>
      <text x="182" y="392" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">[V] 통과 (+10점)</text>
    </g>
  </g>
</svg>