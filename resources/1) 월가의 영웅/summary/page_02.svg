<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0B2545"/>

  <!-- Top Header -->
  <g id="header" transform="translate(60, 45)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#F4F6F9"/>
    <text x="70" y="18" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#C59B27" text-anchor="middle">PART 1. 투자 철학</text>
    
    <text x="0" y="62" font-family="Pretendard, sans-serif" font-size="34" font-weight="800" fill="#0B2545">상식의 위력: 왜 아마추어가 월가 전문가보다 유리한가?</text>
    <text x="0" y="94" font-family="Pretendard, sans-serif" font-size="18" font-weight="500" fill="#5A6578">전문 기관보다 일상생활 속 경험과 관찰에서 위대한 투자 아이디어가 먼저 발견된다</text>
  </g>

  <!-- 3 Column Cards -->
  <g id="content_cards" transform="translate(60, 175)">
    <!-- Card 1 -->
    <g id="card_1" transform="translate(0, 0)">
      <rect width="365" height="380" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#C59B27" rx="3"/>
      
      <circle cx="45" cy="48" r="22" fill="#0B2545"/>
      <text x="45" y="55" font-family="Pretendard, sans-serif" font-size="18" font-weight="700" fill="#E5C158" text-anchor="middle">01</text>
      <text x="80" y="54" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#0B2545">일상 속 관찰의 힘</text>
      
      <line x1="25" y1="85" x2="340" y2="85" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="25" y="125" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#134074">• 소비자의 눈으로 직접 확인</text>
      <text x="25" y="152" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">가족, 쇼핑몰, 병원, 직장에서 인기 있는</text>
      <text x="25" y="174" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">제품과 기업을 누구보다 먼저 체감</text>

      <text x="25" y="220" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#134074">• 현장 경험의 우위</text>
      <text x="25" y="247" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">재무제표 숫자보다 고객 만족도와</text>
      <text x="25" y="269" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">매장 내 붐비는 줄이 가장 빠른 지표</text>

      <rect x="20" y="305" width="325" height="50" rx="8" fill="#FFFFFF"/>
      <text x="35" y="336" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#C59B27">💡 피터 린치 사모님의 던킨도너츠·레그스 발견 사례</text>
    </g>

    <!-- Card 2 -->
    <g id="card_2" transform="translate(397, 0)">
      <rect width="365" height="380" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#0B2545" rx="3"/>
      
      <circle cx="45" cy="48" r="22" fill="#0B2545"/>
      <text x="45" y="55" font-family="Pretendard, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
      <text x="80" y="54" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#0B2545">기관의 구조적 한계</text>
      
      <line x1="25" y1="85" x2="340" y2="85" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="25" y="125" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#134074">• 관료주의와 보고 체계</text>
      <text x="25" y="152" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">월가 펀드매니저는 실패 시 해고 위험 때문에</text>
      <text x="25" y="174" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">이미 유명한 대형주만 매수하는 경향</text>

      <text x="25" y="220" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#134074">• 단기 수익률 압박</text>
      <text x="25" y="247" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">분기별 실적 평가로 인해 진정한</text>
      <text x="25" y="269" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">장기 가치 성장을 기다리지 못함</text>

      <rect x="20" y="305" width="325" height="50" rx="8" fill="#FFFFFF"/>
      <text x="35" y="336" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#EF4444">⚠️ "IBM을 사서 실패하면 아무도 탓하지 않는다"</text>
    </g>

    <!-- Card 3 -->
    <g id="card_3" transform="translate(795, 0)">
      <rect width="365" height="380" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="365" height="6" fill="#134074" rx="3"/>
      
      <circle cx="45" cy="48" r="22" fill="#0B2545"/>
      <text x="45" y="55" font-family="Pretendard, sans-serif" font-size="18" font-weight="700" fill="#E5C158" text-anchor="middle">03</text>
      <text x="80" y="54" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#0B2545">아는 것에만 투자</text>
      
      <line x1="25" y1="85" x2="340" y2="85" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="25" y="125" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#134074">• 비즈니스 모델 이해</text>
      <text x="25" y="152" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">크레용으로 아이에게 설명할 수 없는</text>
      <text x="25" y="174" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">복잡한 기술주/테마주는 매수 금지</text>

      <text x="25" y="220" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#134074">• 확신이 만드는 인내심</text>
      <text x="25" y="247" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">사업의 본질을 완벽히 이해해야만</text>
      <text x="25" y="269" font-family="Pretendard, sans-serif" font-size="15" font-weight="400" fill="#1D2430">주가 출렁임에도 흔들리지 않고 보유 가능</text>

      <rect x="20" y="305" width="325" height="50" rx="8" fill="#FFFFFF"/>
      <text x="35" y="336" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#10B981">✅ "자신이 잘 아는 분야가 최고의 승부처다"</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g id="bottom_banner" transform="translate(60, 580)">
    <rect width="1160" height="75" rx="10" fill="#0B2545"/>
    <text x="40" y="35" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#C59B27">KEY TAKEAWAY</text>
    <text x="40" y="58" font-family="Pretendard, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">"당신이 전문가보다 먼저 유망한 기업을 발견할 확률은 매일 마주치는 일상 속에 항상 존재한다."</text>
  </g>
</svg>