<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#07172C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Decorative geometric accents -->
  <rect x="0" y="0" width="12" height="720" fill="url(#goldGrad)"/>
  <circle cx="1180" cy="100" r="320" fill="#134074" opacity="0.15"/>
  <circle cx="1180" cy="100" r="220" fill="#C59B27" opacity="0.08"/>

  <!-- Content Container -->
  <g transform="translate(100, 140)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#134074"/>
    <text x="110" y="23" font-family="Pretendard, sans-serif" font-size="16" font-weight="600" fill="#E5C158" text-anchor="middle">ONE UP ON WALL STREET</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="Pretendard, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">월가의 영웅</text>

    <!-- Subtitle Line -->
    <rect x="0" y="150" width="80" height="6" fill="url(#goldGrad)" rx="3"/>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="Pretendard, sans-serif" font-size="32" font-weight="600" fill="#F4F6F9">피터 린치의 상식으로 이기는 10루타 투자 전략</text>

    <!-- Core Hook / Description Card -->
    <rect x="0" y="260" width="760" height="90" rx="12" fill="#134074" opacity="0.6"/>
    <rect x="0" y="260" width="6" height="90" fill="#C59B27" rx="3"/>
    <text x="30" y="300" font-family="Pretendard, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF">"전문가보다 일상 속 경험과 상식이 앞선다."</text>
    <text x="30" y="330" font-family="Pretendard, sans-serif" font-size="16" font-weight="400" fill="#8E9AA8">전설적 펀드매니저 피터 린치의 13년간 연평균 29.2% 수익률 실전 바이블</text>

    <!-- Meta Info -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="Pretendard, sans-serif" font-size="16" font-weight="500" fill="#8E9AA8">피터 린치(Peter Lynch) 핵심 투자 철학 요약 프레젠테이션</text>
      <text x="0" y="25" font-family="Pretendard, sans-serif" font-size="14" font-weight="400" fill="#5A6578">마젤란 펀드 실전 성공 원칙 | 가치 성장주 발굴 가이드</text>
    </g>
  </g>

  <!-- Right Decorative Metric Cards -->
  <g transform="translate(900, 220)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="110" rx="12" fill="#134074" opacity="0.4" stroke="#1E4D82" stroke-width="1"/>
    <text x="24" y="40" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#8E9AA8">마젤란 펀드 13년 수익률</text>
    <text x="24" y="85" font-family="Pretendard, sans-serif" font-size="36" font-weight="800" fill="#E5C158">2,703%</text>
    <text x="175" y="82" font-family="Pretendard, sans-serif" font-size="16" font-weight="600" fill="#10B981">연 29.2%</text>

    <!-- Card 2 -->
    <rect x="0" y="130" width="280" height="110" rx="12" fill="#134074" opacity="0.4" stroke="#1E4D82" stroke-width="1"/>
    <text x="24" y="170" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#8E9AA8">핵심 투자 철학</text>
    <text x="24" y="215" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">10-Bagger</text>
    <text x="160" y="213" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#8E9AA8">(10루타 종목)</text>

    <!-- Card 3 -->
    <rect x="0" y="260" width="280" height="110" rx="12" fill="#134074" opacity="0.4" stroke="#1E4D82" stroke-width="1"/>
    <text x="24" y="300" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#8E9AA8">투자 성공 방정식</text>
    <text x="24" y="342" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">상식 + 철저한 조사</text>
  </g>
</svg>